<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Επικοινωνία</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/theme.js"></script>
    <script src="js/menu.js" defer></script>
</head>
<body data-page="contact">

<header class="menu-bar" id="site-header"></header>
<script src="js/header.js"></script> 

<main>
    <section class="page contact-page">
        <p id="MsgForUser">Για να επικοινωνήσεις μαζί μου, το μόνο που χρειάζεται να κάνεις είναι
            να συμπληρώσεις τα στοιχεία σου και το μήνυμα που θέλεις να στείλεις.
        </p>
        <h1>Φόρμα επικοινωνίας</h1>
        <form id="contact-form" action="https://formspree.io/f/mljgnddv" method="POST">
            <label for="onoma">Όνομα</label>
            <input type="text" id="onoma" name="onoma" autocomplete="name" required>
            
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
            
            <label for="minima">Μήνυμα (Μέγιστοι χαρακτήρες -100- )</label>
            <textarea id="minima" name="minima" maxlength="100" required></textarea>
            
            <button type="submit">Αποστολή</button>
        </form>
        <p id="ErrorMsg"></p>

        <p id="SuccessMsg">Το μήνυμά σας στάλθηκε με επιτυχία!! Σύντομα θα επικοινωνήσω μαζί σας.</p>
    </section>
</main>

<script>
    // Δεν γράφω κώδικα για μηνύματα συμπλήρωσης πεδίων, διότι χρησιμοποιώ
    // τα required και maxlength της HTML (ο browser κάνει τον έλεγχο).
    
    const form = document.getElementById("contact-form");
    const successMsg = document.getElementById("SuccessMsg");
    const msgForUser = document.getElementById("MsgForUser");
    const errorMsg = document.getElementById("ErrorMsg");
    const submitButton = form.querySelector("button[type='submit']");

    // Εμφανίζει ένα μήνυμα σφάλματος κάτω από τη φόρμα.
    function showError(message) {
        errorMsg.textContent = message;
        errorMsg.style.display = "block";
    }

    form.addEventListener("submit",async function(e) {
        e.preventDefault();

        // Κρύβουμε παλιό σφάλμα και κλειδώνουμε το κουμπί, για να μην γίνει διπλή αποστολή.
        errorMsg.style.display = "none";
        submitButton.disabled = true;
        submitButton.textContent = "Αποστολή...";

        try {
            const response = await fetch(form.action, {
                method: "POST",
                body: new FormData(form),
                headers: { "Accept": "application/json" }
            });

            if (response.ok) {
                form.style.display = "none";
                successMsg.style.display = "block";
                msgForUser.style.display = "none";
            } else {
                const data = await response.json();
                if (data.errors) {
                    showError(data.errors.map(err => err.message).join(", "));
                } else {
                    showError("Κάτι πήγε στραβά. Δοκίμασε ξανά αργότερα.");
                }
            }
        } catch (error) {
            showError("Δεν ήταν δυνατή η αποστολή. Έλεγξε τη σύνδεσή σου και δοκίμασε ξανά.");
        } finally {
            submitButton.disabled = false;
            submitButton.textContent = "Αποστολή";
        }
    });
</script>

</body>
</html>
